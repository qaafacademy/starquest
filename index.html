<style>

/* Layout: role picker → parent app as a phone-width column with a bottom tab bar; staff consoles as a wide header + tab strip + panels; drawers and full-screen reveal on top */
:root{
  --bg:#F1F6FB; --surface:#FFFFFF; --surface-2:#E7EEF7; --line:#D3DDEA;
  --fg:#14213B; --muted:#55647E; --faint:#8592A9;
  --brand:#0B9B6A; --brand-deep:#067650; --brand-soft:#D8F3E7; --brand-ink:#05683F; --on-brand:#FFFFFF;
  --sun:#FFB81F; --sun-deep:#CF8A00; --sun-soft:#FFF0C7; --sun-ink:#764F00;
  --coral:#FF6A47; --coral-deep:#D9472A; --coral-soft:#FFE1D8; --coral-ink:#A2361C;
  --sky:#2F86EB; --sky-deep:#1D63BC; --sky-soft:#DBE9FF; --sky-ink:#1A57A3;
  --grape:#7A5CF0; --grape-soft:#E9E3FF; --grape-ink:#4A32B8;
  --bronze:#C17A43; --silver:#8F9CAE; --gold:#E9A800; --diamond:#20B2E3; --on-medal:#FFFFFF;
  --scrim:rgba(14,22,40,.5); --shadow:0 12px 36px rgba(21,33,59,.14); --stage:#0E1630; --on-stage:#F4F7FF;
  --font-display:"Baloo 2","Nunito",ui-rounded,system-ui,sans-serif;
  --font-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-arabic:"Amiri","Noto Naskh Arabic","Geeza Pro",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1525; --surface:#162036; --surface-2:#1E2A44; --line:#2B3A58;
  --fg:#EAF0FA; --muted:#A5B2C9; --faint:#7787A3;
  --brand:#25C389; --brand-deep:#13945F; --brand-soft:#123A2C; --brand-ink:#86E6BF; --on-brand:#06261A;
  --sun:#FFC94A; --sun-deep:#C99419; --sun-soft:#3A3013; --sun-ink:#FFE08F;
  --coral:#FF8466; --coral-deep:#D45E43; --coral-soft:#3D2219; --coral-ink:#FFB7A4;
  --sky:#5EA6FF; --sky-deep:#3479D1; --sky-soft:#172C4A; --sky-ink:#AFCFFF;
  --grape:#9C88FF; --grape-soft:#251F48; --grape-ink:#CBC0FF;
  --bronze:#D08B55; --silver:#9DA9BA; --gold:#F2B71B; --diamond:#3CC3EE; --on-medal:#0E1525;
  --scrim:rgba(0,0,0,.62); --shadow:0 12px 36px rgba(0,0,0,.5); --stage:#070B18; --on-stage:#F4F7FF;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1525; --surface:#162036; --surface-2:#1E2A44; --line:#2B3A58;
  --fg:#EAF0FA; --muted:#A5B2C9; --faint:#7787A3;
  --brand:#25C389; --brand-deep:#13945F; --brand-soft:#123A2C; --brand-ink:#86E6BF; --on-brand:#06261A;
  --sun:#FFC94A; --sun-deep:#C99419; --sun-soft:#3A3013; --sun-ink:#FFE08F;
  --coral:#FF8466; --coral-deep:#D45E43; --coral-soft:#3D2219; --coral-ink:#FFB7A4;
  --sky:#5EA6FF; --sky-deep:#3479D1; --sky-soft:#172C4A; --sky-ink:#AFCFFF;
  --grape:#9C88FF; --grape-soft:#251F48; --grape-ink:#CBC0FF;
  --bronze:#D08B55; --silver:#9DA9BA; --gold:#F2B71B; --diamond:#3CC3EE; --on-medal:#0E1525;
  --scrim:rgba(0,0,0,.62); --shadow:0 12px 36px rgba(0,0,0,.5); --stage:#070B18; --on-stage:#F4F7FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.15;text-wrap:balance;font-weight:800}
p{margin:0}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* demo bar */
.demo-bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;padding:7px 16px;background:var(--fg);color:var(--bg);font-size:12.5px;font-weight:700}
.demo-bar b{color:var(--sun)}
.demo-bar button{border:0;background:var(--sun);color:#14213B;border-radius:999px;padding:3px 12px;font-weight:800;font-size:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:9px 16px;font-weight:800;font-size:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);color:var(--fg);transition:transform .06s}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.pri{background:var(--brand);border-color:var(--brand-deep);color:var(--on-brand)}
.btn.sun{background:var(--sun);border-color:var(--sun-deep);color:#2A1B00}
.btn.sky{background:var(--sky);border-color:var(--sky-deep);color:#FFFFFF}
.btn.ghost{border-bottom-width:2px}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:11px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--sky-ink);font-weight:800;text-decoration:underline;text-underline-offset:3px}

/* chips, segments */
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--surface-2);padding:4px;border-radius:14px}
.seg button{border:0;background:none;border-radius:10px;padding:6px 13px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 2px 0 var(--line)}
.chip{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{background:var(--sky-soft);border-color:var(--sky);color:var(--sky-ink)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:11.5px;font-weight:800;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--brand-soft);color:var(--brand-ink)}
.tag.warn{background:var(--sun-soft);color:var(--sun-ink)}
.tag.bad{background:var(--coral-soft);color:var(--coral-ink)}
.tag.info{background:var(--sky-soft);color:var(--sky-ink)}
.tag.grape{background:var(--grape-soft);color:var(--grape-ink)}

/* avatars & bands */
.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:calc(var(--s)*.38);flex:none;line-height:1}
.av-0{background:var(--sky-soft);color:var(--sky-ink)} .av-1{background:var(--grape-soft);color:var(--grape-ink)} .av-2{background:var(--coral-soft);color:var(--coral-ink)} .av-3{background:var(--brand-soft);color:var(--brand-ink)} .av-4{background:var(--sun-soft);color:var(--sun-ink)}
.band{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12.5px;padding:2px 10px 2px 4px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.band i{width:16px;height:16px;border-radius:50%;display:block}
.b-bronze i{background:var(--bronze)} .b-silver i{background:var(--silver)} .b-gold i{background:var(--gold)} .b-diamond i{background:var(--diamond)} .b-none i{background:var(--line)}
.medal{width:var(--m,64px);height:var(--m,64px);border-radius:50%;display:grid;place-items:center;color:var(--on-medal);font-family:var(--font-display);font-weight:800;font-size:calc(var(--m,64px)*.42);box-shadow:inset 0 -5px 0 rgba(0,0,0,.15);flex:none}
.medal.bronze{background:var(--bronze)} .medal.silver{background:var(--silver)} .medal.gold{background:var(--gold)} .medal.diamond{background:var(--diamond)} .medal.none{background:var(--surface-2);color:var(--faint);box-shadow:none}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--brand)}
.bar.sun>span{background:var(--sun)} .bar.sky>span{background:var(--sky)} .bar.grape>span{background:var(--grape)} .bar.coral>span{background:var(--coral)}

/* ===== LOGIN ===== */
.login{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:grid;gap:22px}
.hero{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center}
.hero h1{font-size:clamp(34px,6vw,52px);letter-spacing:-.01em}
.hero h1 span{color:var(--brand)}
.hero p{color:var(--muted);font-size:16px;max-width:52ch}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.role-card{border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;background:var(--surface);padding:18px;text-align:left;display:grid;gap:8px;align-content:start}
.role-card:hover{border-color:var(--sky)}
.role-card .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px}
.role-card h3{font-size:21px}
.role-card p{color:var(--muted);font-size:13.5px}
.login-box{max-width:460px;width:100%;justify-self:center;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:22px;display:grid;gap:14px}
.field{display:grid;gap:5px;min-width:0}
.field label,.field .lbl{font-weight:800;font-size:13px;color:var(--muted)}
.inp,select.inp,textarea.inp{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:9px 12px;font-weight:700;width:100%;min-width:0}
.inp:focus{border-color:var(--sky);outline:none}
.err{color:var(--coral-ink);font-weight:800;font-size:13px}
.namegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.namegrid button{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);padding:10px;font-weight:800;text-align:left;display:flex;gap:8px;align-items:center}
.namegrid button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}

/* ===== KID (PARENT) APP ===== */
.kid{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px 0;display:grid;gap:14px;min-height:calc(100vh - 34px);grid-template-rows:auto 1fr auto}
.k-head{display:flex;align-items:center;gap:12px}
.k-head .who{flex:1;min-width:0}
.k-head .who b{font-family:var(--font-display);font-size:20px;display:block;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k-head .who span{font-size:12.5px;color:var(--muted);font-weight:700}
.icon-btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-size:18px;flex:none}
.k-main{display:grid;gap:14px;align-content:start;padding-bottom:12px}
.k-card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px;display:grid;gap:12px}
.k-card h3{font-size:19px}
.bubble-row{display:flex;gap:10px;align-items:flex-end}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:20px 20px 20px 6px;padding:11px 14px;font-weight:700;font-size:14.5px;flex:1;min-width:0}
.stars-card{background:linear-gradient(135deg,var(--sun-soft),var(--surface));}
.big-num{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1}
.statrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface-2);border-radius:16px;padding:10px 12px;display:grid;gap:2px}
.stat b{font-family:var(--font-display);font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:800}
.round-card{border-color:var(--sky)}
.ring{--p:50;--c:var(--sky);width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-family:var(--font-display);font-size:24px}
.ring small{display:block;font-size:10.5px;color:var(--muted);font-weight:800}
.hint{background:var(--sky-soft);color:var(--sky-ink);border-radius:14px;padding:9px 12px;font-weight:800;font-size:13.5px}
.hint.sun{background:var(--sun-soft);color:var(--sun-ink)}
.hint.ok{background:var(--brand-soft);color:var(--brand-ink)}
.hint.grape{background:var(--grape-soft);color:var(--grape-ink)}
.hint.coral{background:var(--coral-soft);color:var(--coral-ink)}
.mission{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:2px dashed var(--line)}
.mission:first-of-type{border-top:0}
.mission .tick{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-weight:900;flex:none;color:var(--on-brand)}
.mission.done .tick{background:var(--brand);border-color:var(--brand)}
.mission .txt{flex:1;min-width:0;font-weight:700}
.mission .txt small{display:block;color:var(--muted);font-weight:700}
.pillars{display:grid;gap:10px}
.pillar{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.pillar .pi{font-size:22px;text-align:center}
.pillar .pn{font-weight:800;font-size:13.5px}
.pillar .pv{font-weight:800;font-size:13px;color:var(--muted)}
.tree-wrap{display:flex;gap:14px;align-items:center}
.tree-wrap svg{flex:none}
.phases{display:flex;gap:4px;flex-wrap:wrap}
.phases span{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--faint)}
.phases span.on{background:var(--brand-soft);color:var(--brand-ink)}
.phases span.now{background:var(--brand);color:var(--on-brand)}
.nav-b{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--surface);border-top:2px solid var(--line);margin-inline:-16px;padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:5}
.nav-b button{border:0;background:none;display:grid;justify-items:center;gap:1px;padding:5px 2px;border-radius:12px;font-weight:800;font-size:11px;color:var(--muted)}
.nav-b button i{font-style:normal;font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.75}
.nav-b button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink)}
.nav-b button[aria-current="page"] i{filter:none;opacity:1}
.nav-b .dot{position:relative}
.nav-b .dot::after{content:"";position:absolute;top:2px;right:28%;width:8px;height:8px;border-radius:50%;background:var(--coral)}

/* check-in */
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.dates button{border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);border-radius:16px;padding:7px 12px;font-weight:800;display:grid;justify-items:center;line-height:1.15;min-width:72px;flex:none}
.dates button small{font-size:11px;color:var(--muted)}
.dates button[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft);color:var(--sky-ink)}
.routines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rt{border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;background:var(--surface);padding:12px 10px 10px;display:grid;justify-items:center;gap:4px;text-align:center;position:relative;min-height:116px;align-content:center}
.rt .em{font-size:36px;line-height:1.1}
.rt .rn{font-weight:800;font-size:13.5px;line-height:1.2}
.rt .chk{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font-weight:900;font-size:14px;color:var(--on-brand)}
.rt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.rt[aria-pressed="true"] .chk{background:var(--brand);border-color:var(--brand)}
.rt-info{border:0;background:none;color:var(--sky-ink);font-weight:800;font-size:12px;padding:2px 6px;text-decoration:underline}
.progress-head{display:flex;align-items:center;gap:12px}
.progress-head .bar{flex:1;height:14px}

/* leaderboard */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;text-align:center}
.pd{display:grid;justify-items:center;gap:6px}
.pd .stand{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--on-medal)}
.pd.p1 .stand{height:84px;background:var(--gold)} .pd.p2 .stand{height:62px;background:var(--silver)} .pd.p3 .stand{height:48px;background:var(--bronze)}
.pd .nm{font-weight:800;font-size:13px;line-height:1.2;min-height:2.4em}
.pd .pts{font-size:12px;font-weight:800;color:var(--muted)}
.mystery{background:var(--grape-soft)!important;color:var(--grape-ink)!important}
.lb{display:grid}
.lb-row{display:grid;grid-template-columns:34px auto 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-top:2px solid var(--surface-2);border-radius:12px}
.lb-row:first-child{border-top:0}
.lb-row .rk{font-family:var(--font-display);font-weight:800;color:var(--muted);text-align:center;font-size:17px}
.lb-row .nm{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .nm small{display:block;font-weight:700;color:var(--muted);font-size:12px}
.lb-row .val{font-family:var(--font-display);font-weight:800;font-size:17px;text-align:right}
.lb-row.me{background:var(--sun-soft);border-top-color:transparent}
.stargroup{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;text-align:center}
.stargroup div{display:grid;justify-items:center;gap:4px;font-weight:800;font-size:12px;line-height:1.15}
.stargroup div.me .av{outline:4px solid var(--sun)}
.cup{display:grid;grid-template-columns:90px 1fr 48px;gap:10px;align-items:center;font-weight:800;font-size:13.5px}
.cup .bar{height:14px}
.cup .v{text-align:right;font-variant-numeric:tabular-nums}

/* badges */
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bdg{border:0;background:none;display:grid;justify-items:center;gap:5px;text-align:center;padding:4px}
.bdg .disc{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:var(--sun-soft);border:3px solid var(--sun);box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
.bdg.locked .disc{background:var(--surface-2);border-color:var(--line);filter:grayscale(1);opacity:.55}
.bdg b{font-size:12px;font-weight:800;line-height:1.2}
.bdg small{font-size:10.5px;color:var(--muted);font-weight:700}
.levels{display:grid;gap:6px}
.lvl-row{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:12px;font-weight:800;font-size:13.5px}
.lvl-row.done{color:var(--brand-ink)} .lvl-row.cur{background:var(--sun-soft);color:var(--sun-ink)} .lvl-row.next{color:var(--faint)}

/* poster */
.poster{--g1:var(--gold);--g2:var(--sun);aspect-ratio:4/5;width:100%;max-width:100%;border-radius:18px;background:linear-gradient(160deg,var(--g1),var(--g2));color:#FFFFFF;display:grid;grid-template-rows:auto auto 1fr auto auto auto;justify-items:center;text-align:center;padding:7% 6%;gap:2%;position:relative;overflow:hidden;container-type:inline-size}

.poster::after{content:"";position:absolute;inset:auto auto -25% -25%;width:70%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.10)}

.pz-top{font-weight:900;letter-spacing:.14em;font-size:4.4cqw}

.pz-name{font-family:var(--font-display);font-weight:800;font-size:8.5cqw;line-height:1.05}
.pz-award{background:rgba(255,255,255,.95);color:#14213B;border-radius:999px;padding:2cqw 5cqw;font-weight:900;font-size:5.2cqw}
.pz-foot{font-weight:800;font-size:3.6cqw;opacity:.95}
.pz-champ{--g1:#F2A900;--g2:#FF7A45} .pz-rise{--g1:#2F86EB;--g2:#7A5CF0} .pz-streak{--g1:#FF6A47;--g2:#FFB81F} .pz-choice{--g1:#0B9B6A;--g2:#2F86EB} .pz-canva{--g1:#7A5CF0;--g2:#FF6A47} .pz-perfect{--g1:#067650;--g2:#0B9B6A} .pz-gold{--g1:#B8860B;--g2:#F2B700} .pz-academy{--g1:#4A32B8;--g2:#2F86EB}

/* reveal */
.reveal{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 20%,#24305C,var(--stage) 70%);color:var(--on-stage);display:grid;grid-template-rows:auto 1fr auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 18px);gap:12px}

.rv-stage{display:grid;place-items:center;text-align:center;gap:14px;align-content:center}

@media (prefers-reduced-motion:no-preference){

  .rt{transition:background .15s,border-color .15s}
}

<script>
/* ===================================================================
   Star Quest engine. Pure functions over the model M.
   The same code runs inside Apps Script (server) and in the app.
   Dates are 'yyyy-mm-dd' strings; date maths is done in UTC.
   =================================================================== */
var SQ = (function () {
  'use strict';
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  function D(s) { var p = String(s).split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
  function iso(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function addDays(s, n) { var d = D(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); }
  function dow(s) { return D(s).getUTCDay(); }
  function diffDays(a, b) { return Math.round((D(b) - D(a)) / 864e5); }
  var DAYOFF = { Saturday: 0, Sunday: 1, Monday: 2, Tuesday: 3, Wednesday: 4, Thursday: 5, Friday: 6 };
  var CLASSES = ['Root 1', 'Root 3', 'Root 5', 'Stem 1', 'Stem 3'];
  var LAUNCH = '2026-10-10';
  var QN = ['', 'Good', 'Excellent', 'Outstanding'];
  var BANDS = ['none', 'bronze', 'silver', 'gold', 'diamond'];
  var BANDN = { none: 'No band yet', bronze: 'Bronze', silver: 'Silver', gold: 'Gold', diamond: 'Diamond' };
  var PHASES = [{ n: 'Planting', e: '🌱' }, { n: 'Watering', e: '💧' }, { n: 'Growing', e: '🌿' }, { n: 'Strengthening', e: '🌳' }, { n: 'Harvesting', e: '🍎' }];
  var AWN = { champ: 'Round Champion', streak: 'Streak Master', choice: "Mentor's Choice", canva: 'Best Canva Board', perfect: 'Perfect Attendance', gold: 'Gold Club', academy: 'Academy Champion' };
  var AWE = { champ: '🏆', streak: '🔥', choice: '💚', canva: '🏠', perfect: '🎯', gold: '🌟', academy: '👑' };
  var TITLED = ['champ', 'streak', 'choice', 'canva', 'academy'];

  function phaseFor(n) { return n <= 2 ? 0 : n <= 4 ? 1 : n <= 6 ? 2 : n <= 8 ? 3 : 4; }
  function cache(M) { if (!M._c) M._c = {}; return M._c; }
  function bump(M) { M._c = {}; }
  function sid(M) { var c = cache(M); if (!c.sid) { c.sid = {}; M.students.forEach(function (s) { c.sid[s.id] = s; }); } return c.sid; }
  function active(M) { return M.students.filter(function (s) { return s.status === 'Active'; }); }

  /* ---------------- calendar ---------------- */
  function roundOfDate(M, d) { for (var i = 0; i < M.rounds.length; i++) if (d >= M.rounds[i].start && d <= M.rounds[i].end) return M.rounds[i].n; return 0; }
  function curRound(M) {
    var r = roundOfDate(M, M.today); if (r) return r;
    if (M.today < M.rounds[0].start) return 1;
    return M.rounds[M.rounds.length - 1].n;
  }
  function round(M, n) { return M.rounds[n - 1]; }
  function weekOfDate(M, d) { for (var i = 0; i < M.weeks.length; i++) if (d >= M.weeks[i].start && d <= M.weeks[i].end) return M.weeks[i].w; return 0; }
  function curWeek(M) {
    var w = weekOfDate(M, M.today); if (w) return w;
    return M.today < M.weeks[0].start ? 0 : M.weeks.length;
  }
  function week(M, w) { return M.weeks[w - 1]; }

function watchList() {

    }).join('') + '</tbody></table></div>';

    b += '<section class="panel"><div class="panel-head"><h2>Round ' + rn + ' awards & posters</h2><p>' + (SQ.revealOpen(M, rn) ? 'Results are out.' : 'Released. Results open at ' + esc(revealText(rn)) + '.') + ' Tap a poster to share it on WhatsApp.</p></div>' +

  } else if (k === 'pmsg') {
    const text = String(fd.get('text') || '').trim(), cat = String(fd.get('cat')), err = $('#pm-err'), s = kidOf();
    if (!text) { err.textContent = 'Write a short message first.'; err.hidden = false; return; }
    const leave = cat === 'Leave notice' ? String(fd.get('leave') || '') : '';
    save('msg.send', { sid: s.id, cat, text, leave }, 'Sent to the mentor.', r => { state.D.messages = state.D.messages || []; state.D.messages.push({ id: r.id, date: M.today, sid: s.id, cat, text, leave, status: 'new' }); });
  } else if (k === 'reply') {
    const text = String(fd.get('text') || '').trim(); if (!text) return; const m = state.D.messages.find(x => x.id === f.dataset.id);
    save('msg.reply', { id: m.id, text }, 'Reply sent', () => { m.reply = m.reply ? m.reply + '\n' + text : text; if (m.status === 'new') m.status = 'closed'; state.msgOpen = m.id; });
  } else if (k === 'done') {
    const m = state.D.messages.find(x => x.id === f.dataset.id), note = String(fd.get('note') || '').trim();
    save('msg.done', { id: m.id, note }, 'Marked as answered. The mentor and the parent can see it.', () => { m.status = 'done'; m.doneBy = state.user; m.tnote = note; });
  } else if (k === 'bonus') {
    const type = f.dataset.type, sid = String(fd.get('sid')), note = String(fd.get('note') || '').trim();
    save('bonus.add', { items: [{ id: sid, type, note }] }, (type === 'mentor' ? 'Appreciation' : 'Activity of the Week') + ' given to ' + firstName(SID()[sid].name) + ' · +' + (type === 'mentor' ? M.P.MA : M.P.AW), () => { M.bonus.push({ date: M.today, id: sid, type, by: state.user, note }); confetti(); });
  } else if (k === 'student') {
    const fields = {}; ['id', 'name', 'cls', 'type', 'batch', 'teacher', 'med', 'thg', 'thl', 'dob', 'region', 'fam', 'status', 'notes'].forEach(x => fields[x] = String(fd.get(x) || '').trim());
    const err = $('#sf-err'); const orig = f.dataset.orig;
    if (!fields.id || !fields.name) { err.textContent = 'Enter the Qaaf ID and name.'; err.hidden = false; return; }
    if (fields.type === 'Batch' && !fields.batch) { err.textContent = 'Choose the batch.'; err.hidden = false; return; }
    if (fields.type === 'Individual' && !fields.teacher) { err.textContent = 'Choose the individual teacher.'; err.hidden = false; return; }
    api('student.save', { orig, fields }).then(() => { state.edit = null; closeLayer(); toast(orig ? 'Saved' : 'Child added'); boot(); }).catch(x => { err.textContent = x.message; err.hidden = false; });
  }
});
$('#scrim').addEventListener('click', () => { state.edit = null; closeLayer(); render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (RV) { RV = null; $('#layer').innerHTML = ''; } else { state.edit = null; closeLayer(); render(); } } });
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
render();
boot();
})();

</script>
